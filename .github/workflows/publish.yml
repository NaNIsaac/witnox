name: Publish to PyPI

on:
  release:
    types: [published]
  # Runs the gates alone, without an upload, to check them off a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    uses: NaNIsaac/.github/.github/workflows/publish-gates.yml@284b0786020434df16b096a3e11c56c6331dd81f
    permissions:
      contents: read
    with:
      import-name: witnox
      test-command: uv run pytest -q && uv run ruff check .
      smoke: witnox --help

  publish:
    name: Publish
    needs: gates
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/witnox/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} must equal {expected!r}")
          PY
      # The files the gates checked, not a new build
      - uses: actions/download-artifact@v8
        with:
          name: publish-gates-dist
          path: dist
      - name: Publish distributions via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
