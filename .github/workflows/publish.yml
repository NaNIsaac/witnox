name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    environment:
      name: release
      url: https://pypi.org/project/witnox/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Ensure tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if os.environ["EVENT_NAME"] == "release" and actual != expected:
              raise SystemExit(f"Tag {actual!r} must equal {expected!r}")
          if os.environ["EVENT_NAME"] != "release":
              print(f"Manual publish from main for package version {version}")
          PY
      - name: Install and verify
        run: |
          uv sync --extra dev
          uv run pytest -q
          uv run ruff check .
      - name: Build distributions
        run: uv build
      - name: Publish distributions via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
